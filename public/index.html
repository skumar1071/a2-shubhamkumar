<!doctype html>
<html lang='en'>
  <head>
    <title>Workout Tracker</title>
    <meta charset='utf-8' >
    <meta name='viewport' content='width=device-width, initial-scale=1' >
    <script src='js/main.js'></script>
    <link rel='stylesheet' href='css/main.css' >
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' >
  </head>
  <body>
    <header>
      <h1>Workout Tracker</h1>
      <p>Log your exercises and track your training volume.</p>
    </header>

    <main>
      <section id='entry-section'>
        <h2>Log an Exercise</h2>

        <form id='workout-form'>
          <div class='form-group'>
            <label for='exercise'>Exercise</label>
            <input type='text' id='exercise' name='exercise' placeholder='Bench Press' required>
          </div>

          <div class='form-group'>
            <label for='sets'>Sets</label>
            <input type='number' id='sets' name='sets' min='1' required>
          </div>

          <div class='form-group'>
            <label for='reps'>Reps</label>
            <input type='number' id='reps' name='reps' min='1' required>
          </div>

          <div class='form-group'>
            <label for='weight'>Weight (lb)</label>
            <input type='number' id='weight' name='weight' min='0' step='0.5' required>
          </div>

          <button type='submit' id='submit-button'>Add Exercise</button>
        </form>
      </section>

      <section id='results-section'>
        <h2>Workout Log</h2>

        <table>
          <thead>
            <tr>
              <th>Exercise</th>
              <th>Sets</th>
              <th>Reps</th>
              <th>Weight</th>
              <th>Volume</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id='workout-results'>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
